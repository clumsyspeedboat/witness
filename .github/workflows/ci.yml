name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the compiler, rustfmt and clippy.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --release --all-targets --all-features --locked -- -D warnings
      # The corpus is not vendored, so CI runs the suite that needs no downloads.
      - run: cargo test --release --all-features --locked
