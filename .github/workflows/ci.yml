name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Same data-free path documented for a fresh reviewer clone.
      - run: make verify
      - run: ./experiments/run_query_optimization.sh --smoke
